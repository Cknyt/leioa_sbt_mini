<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leioa SBT · Minibasket A</title>
  <meta name="description" content="Calendario de partidos de Leioa SBT, minibasket masculino A.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top__row">
      <div>
        <h1>Leioa SBT</h1>
        <p class="sub" id="subtitle">Minibasket masculino A</p>
      </div>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Cambiar tema claro/oscuro">
        <span aria-hidden="true" id="theme-icon">◐</span>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section aria-labelledby="next-title" id="next-section" hidden>
      <h2 id="next-title" class="section-title">Próximo partido</h2>
      <div id="next"></div>
    </section>

    <section aria-labelledby="standing-title" id="standing-section" hidden>
      <h2 id="standing-title" class="section-title">Clasificación</h2>
      <div class="table-wrap" id="standing"></div>
    </section>

    <section aria-labelledby="all-title">
      <h2 id="all-title" class="section-title">Todos los partidos</h2>
      <div id="list" class="list" aria-live="polite">
        <p class="muted">Cargando…</p>
      </div>
    </section>

    <p class="cal">
      <a href="calendario.ics">Suscribirse al calendario (.ics)</a>
    </p>
  </main>

  <footer class="wrap foot">
    <p id="updated" class="muted"></p>
  </footer>

  <script src="js/app.js" type="module"></script>
</body>
</html>
