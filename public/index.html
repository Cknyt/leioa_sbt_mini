<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leioa SBT · Minibasket A</title>
  <meta name="description" content="Calendario de partidos de Leioa SBT, minibasket masculino A.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0a5c36">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/escudos/17087.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="hero">
    <div class="wrap hero__inner">
      <img class="hero__mark" id="team-mark" alt="" aria-hidden="true" hidden>
      <img class="hero__crest" id="team-crest" alt="" hidden>
      <div class="hero__text">
        <p class="eyebrow">Sasibaloi Taldea · Bizkaia</p>
        <h1>Leioa SBT <span class="mini-tag">Mini</span></h1>
        <p class="hero__sub" id="subtitle"></p>
      </div>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Cambiar tema claro/oscuro">
        <span aria-hidden="true">◐</span>
      </button>
    </div>
  </header>

  <main class="wrap main">
    <section aria-labelledby="next-title" id="next-section" hidden>
      <h2 id="next-title" class="sr-only">Próximo partido</h2>
      <div id="next"></div>
    </section>

    <p id="live-status" class="live-status" role="status" hidden></p>

    <section aria-labelledby="summary-title" id="summary-section" hidden>
      <h2 id="summary-title" class="section-title">Nuestra temporada</h2>
      <div id="summary" class="summary"></div>
    </section>

    <section aria-labelledby="group-title" id="group-section" hidden>
      <h2 id="group-title" class="section-title">Partidos del grupo</h2>
      <div id="group" class="group"></div>
    </section>

    <section aria-labelledby="standing-title" id="standing-section" hidden>
      <h2 id="standing-title" class="section-title">Clasificación</h2>
      <div class="table-wrap" id="standing"></div>
      <p id="standing-note" class="muted note"></p>
    </section>

    <section aria-labelledby="all-title">
      <h2 id="all-title" class="section-title">Temporada</h2>
      <div id="list" class="list" aria-live="polite">
        <p class="muted">Cargando…</p>
      </div>
    </section>

    <a class="cal-link" href="calendario.ics">📅 Suscribirse al calendario</a>
  </main>

  <footer class="wrap foot">
    <p class="foot__brand">Leioa SBT Mini · Sasibaloi Taldea</p>
    <p id="updated" class="muted"></p>
  </footer>

  <script src="js/app.js" type="module"></script>
</body>
</html>
